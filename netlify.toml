[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"

[[redirects]]
  from = "/takiwaki"
  to = "/?legacy=takiwaki"
  status = 301
  force = true

[[redirects]]
  from = "/takiwaki.html"
  to = "/?legacy=takiwaki"
  status = 301
  force = true

[[redirects]]
  from = "/teacher"
  to = "/teacher.html"
  status = 200

[[redirects]]
  from = "/lesson/:id"
  to = "/lesson.html?id=:id"
  status = 200

[[redirects]]
  from = "/phrases"
  to = "/phrases.html"
  status = 200

[[redirects]]
  from = "/plans"
  to = "/pricing.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
