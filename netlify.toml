[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https://ycmybggetemkhorkhfnf.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests"

[[redirects]]
  from = "/takiwaki"
  to = "/?legacy=takiwaki"
  status = 301
  force = true

[[redirects]]
  from = "/takiwaki.html"
  to = "/?legacy=takiwaki"
  status = 301
  force = true

[[redirects]]
  from = "/teacher"
  to = "/teacher.html"
  status = 200

[[redirects]]
  from = "/lesson/:id"
  to = "/lesson.html?id=:id"
  status = 200

[[redirects]]
  from = "/learn"
  to = "/learn.html"
  status = 200

[[redirects]]
  from = "/words"
  to = "/learn.html?category=words"
  status = 200

[[redirects]]
  from = "/phonics"
  to = "/learn.html?category=phonics"
  status = 200

[[redirects]]
  from = "/phrases"
  to = "/phrases.html"
  status = 200

[[redirects]]
  from = "/plans"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/pricing-layout-preview"
  to = "/pricing-layout-preview.html"
  status = 200

[[redirects]]
  from = "/music-credits"
  to = "/music-credits.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "/assets/audio/ambient/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/curriculum/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
