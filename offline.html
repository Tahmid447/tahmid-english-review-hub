<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2234">
  <title>Offline · Tahmid English Review Hub</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#f8f3e8;color:#10283a}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(560px,100%);padding:32px;border-radius:24px;background:#fff;border:1px solid #d9d2c4;box-shadow:0 18px 50px #10283a1f}.logo{width:72px;height:72px;border-radius:18px}h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.08}p{font-size:1rem;line-height:1.7}.button{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:999px;background:#0b5269;color:#fff;text-decoration:none;font-weight:700}@media(prefers-color-scheme:dark){:root{background:#071722;color:#f5f1e8}.card{background:#0d2533;border-color:#315064;box-shadow:none}.button{background:#67c8c0;color:#071722}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/app-icon-192.png" alt="Tahmid English Club logo" width="72" height="72">
    <h1>You’re offline.<br><span lang="ja">現在オフラインです。</span></h1>
    <p>Reconnect to open lessons, account records, audio and teacher feedback.</p>
    <p lang="ja">レッスン・個人記録・音声・先生からのフィードバックを開くには、インターネットへ再接続してください。</p>
    <a class="button" href="/">Try again / もう一度試す</a>
  </main>

</html>
